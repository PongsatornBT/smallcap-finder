# All knobs for the daily scan live here. Edit values, commit, done.

# Used in the User-Agent header for SEC EDGAR requests (they require a contact).
contact_email: pongsatorn.boontham@gmail.com

subreddits:
  - pennystocks
  - smallstreetbets
  - wallstreetbets
  - stocks

reddit:
  posts_per_subreddit: 150      # newest posts to scan (stops early at the 24h cutoff)
  comments_per_subreddit: 300   # newest comments to scan per subreddit

# Buzz scoring
min_unique_authors: 5     # fewer distinct people than this = noise, ignored
baseline_floor: 0.5       # minimum 30-day baseline; makes brand-new tickers rank highest
trending_bonus: 1.2       # score multiplier when on the StockTwits trending list
top_n: 30                 # how many top-buzz tickers go through the quality gate
history_days: 90          # rolling history retention
short_history_days: 14    # below this many days of history, results get a "short history" note
spark_days: 7             # length of the sparkline on the dashboard
sample_posts_per_ticker: 3

quality:
  market_cap_min: 50000000        # $50M
  market_cap_max: 2000000000      # $2B
  min_price: 1.0                  # dollars
  min_dollar_volume: 200000       # 30-day average daily dollar volume
  min_revenue: 1000000            # latest annual revenue per SEC EDGAR
  allowed_exchanges: [NYSE, NASDAQ, AMEX]

# --- Company-name recognition -------------------------------------------
# Besides ticker symbols, posts that mention a company BY NAME also count.
# Multi-word names are learned automatically from the official SEC company
# list ("Virgin Galactic Holdings, Inc" -> "virgin galactic" -> SPCE), so
# all ~10,000 listed firms are covered without any setup.
company_name_matching: true

# One-word nicknames are never auto-learned (too risky: "apple", "target").
# Add the ones you care about here yourself: TICKER: [list of names].
# Matching is case-insensitive, whole words only.
ticker_aliases:
  PLTR: ["palantir"]
  IONQ: ["ionq"]
  JOBY: ["joby"]
  OKLO: ["oklo"]
  RKLB: ["rocketlab"]

# Auto-learned name phrases that cause false alarms in normal sentences.
# Anything listed here is never matched as a company name.
company_name_blocklist:
  - "big lots"

# Symbols that are also common words / slang. They only count when written
# as a cashtag ($CEO), never as a bare word. Symbols of 1-2 letters always
# require a cashtag regardless of this list.
cashtag_only_max_len: 2
ticker_blocklist:
